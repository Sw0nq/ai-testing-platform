{% extends "base.html" %}

{% block title %}Edit {{ page.name }} | AI Testing Platform{% endblock %}

{% block content %}
    <section class="page-header">
        <div>
            <h1>Edit page</h1>
            <p class="subtitle">{{ page.name }}</p>
        </div>
        <a class="button secondary" href="{% url 'trainer:page_detail' page.pk %}">Back to detail</a>
    </section>

    <section class="panel">
        <form method="post" class="form-grid">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    {{ field.label_tag }}
                    {{ field }}
                    {{ field.errors }}
                </div>
            {% endfor %}
            <div class="actions">
                <button class="button" type="submit">Save changes</button>
                <a class="button secondary" href="{% url 'trainer:page_detail' page.pk %}">Cancel</a>
            </div>
        </form>
    </section>
{% endblock %}
