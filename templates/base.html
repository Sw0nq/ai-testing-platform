<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI Testing Platform{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f6f8fb;
            --surface: #ffffff;
            --text: #172033;
            --muted: #647084;
            --border: #d9e0ea;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
            line-height: 1.5;
        }

        a {
            color: var(--primary);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .navbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .navbar-inner {
            align-items: center;
            display: flex;
            gap: 16px;
            justify-content: space-between;
            margin: 0 auto;
            max-width: 1080px;
            padding: 14px 20px;
        }

        .brand {
            color: var(--text);
            font-weight: 700;
        }

        .nav-links {
            align-items: center;
            display: flex;
            gap: 14px;
        }

        .nav-button {
            background: none;
            border: 0;
            color: var(--primary);
            cursor: pointer;
            font: inherit;
            padding: 0;
        }

        .container {
            margin: 0 auto;
            max-width: 1080px;
            padding: 28px 20px;
        }

        .page-header {
            align-items: flex-start;
            display: flex;
            gap: 16px;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        h1 {
            font-size: 30px;
            line-height: 1.2;
            margin: 0 0 8px;
        }

        .subtitle,
        .muted {
            color: var(--muted);
        }

        .messages {
            display: grid;
            gap: 12px;
            margin-bottom: 22px;
        }

        .message {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 14px;
        }

        .message.success {
            background: #ecfdf5;
            border-color: #bbf7d0;
            color: #166534;
        }

        .message.error {
            background: #fef2f2;
            border-color: #fecaca;
            color: #991b1b;
        }

        .message.warning {
            background: #fffbeb;
            border-color: #fde68a;
            color: #92400e;
        }

        .message.info {
            background: #eff6ff;
            border-color: #bfdbfe;
            color: #1e40af;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }

        .table {
            border-collapse: collapse;
            width: 100%;
        }

        .table th,
        .table td {
            border-bottom: 1px solid var(--border);
            padding: 12px;
            text-align: left;
            vertical-align: top;
        }

        .table th {
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .button {
            background: var(--primary);
            border: 1px solid var(--primary);
            border-radius: 6px;
            color: #ffffff;
            display: inline-block;
            font: inherit;
            padding: 8px 12px;
            text-decoration: none;
        }

        .button:hover {
            background: var(--primary-hover);
            text-decoration: none;
        }

        .button.secondary {
            background: var(--surface);
            color: var(--primary);
        }

        .button.secondary:hover {
            background: #eff6ff;
        }

        .button.danger {
            background: var(--danger);
            border-color: var(--danger);
        }

        .button.danger:hover {
            background: var(--danger-hover);
        }

        .form-grid {
            display: grid;
            gap: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .form-control {
            border: 1px solid var(--border);
            border-radius: 6px;
            display: block;
            font: inherit;
            padding: 10px 12px;
            width: 100%;
        }

        .errorlist {
            color: var(--danger);
            margin: 6px 0 0;
            padding-left: 20px;
        }

        .details {
            display: grid;
            gap: 12px;
        }

        .details dt {
            color: var(--muted);
            font-weight: 700;
        }

        .details dd {
            margin: 0;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a class="brand" href="{% url 'trainer:page_list' %}">AI Testing Platform</a>
            <div class="nav-links">
                <a href="{% url 'trainer:page_list' %}">Главная</a>
                <a href="{% url 'admin:index' %}">Админка</a>
                <form action="{% url 'admin:logout' %}" method="post">
                    {% csrf_token %}
                    <button class="nav-button" type="submit">Выйти</button>
                </form>
            </div>
        </div>
    </nav>

    <main class="container">
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message {{ message.tags }}" role="alert">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
